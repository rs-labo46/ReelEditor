services:
  frontend:
    build:
      context: ./frontend/01
      dockerfile: Dockerfile
    environment:
      VITE_API_TARGET: "http://api:8080"
      VITE_USE_MOCK: "true"
      VITE_MOCK_STAGE: "1"
      VITE_MOCK_SCENARIO: "normal"
    ports:
      - "127.0.0.1:3000:5173"
    volumes:
      - ./frontend/01:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  reel_pg:
